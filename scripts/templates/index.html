<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  padding: 10px;
}

h1 {
  text-align: center;
  color: #a0d4f5;
  font-size: 22px;
  margin-bottom: 10px;
}

.panel {
  background: #2a2a4a;
  border: 1px solid #3a3a6a;
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 10px;
}

.panel-title {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #6a8aaa;
  margin-bottom: 10px;
}

/* ── Controls ─────────────────────────────────────────── */

#controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

#controls label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #aac;
  font-size: 14px;
}

input[type="date"] {
  background: #1e1e3a;
  border: 1px solid #4a4a8a;
  border-radius: 5px;
  color: #eee;
  padding: 5px 10px;
  font-size: 14px;
  color-scheme: dark;
}

input[type="date"]:focus {
  outline: none;
  border-color: #a0d4f5;
}

#refresh-btn {
  padding: 7px 20px;
  background: #4caf50;
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.15s;
}

#refresh-btn:hover    { background: #45a049; }
#refresh-btn:disabled { background: #2a5a2a; cursor: not-allowed; }

#status { font-size: 12px; font-style: italic; }
#status.loading { color: #a0d4f5; }
#status.ok      { color: #4caf50; }
#status.error   { color: #f44336; }

/* ── Chart ────────────────────────────────────────────── */

#chart-wrap { height: 420px; position: relative; }

/* ── Table ────────────────────────────────────────────── */

.table-wrap {
  overflow-x: auto;
  overflow-y: auto;
  max-height: 55vh;
}

table { border-collapse: collapse; width: 100%; font-size: 0.82em; }

thead th {
  background: #1a1a3a;
  color: #a0d4f5;
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 5px 8px;
  white-space: nowrap;
  border: 1px solid #3a3a6a;
  text-align: left;
}

tbody td {
  padding: 4px 8px;
  white-space: nowrap;
  border: 1px solid #252545;
  vertical-align: middle;
}

tr.ob td                       { background: #1a2540; font-style: italic; color: #90c4e5; }
tr:nth-child(even):not(.ob)    { background: #222240; }
tr:hover:not(.ob)              { background: #1e2e3a; }

td.r      { text-align: right; }
td.neg    { color: #f44336; text-align: right; }
td.pos    { text-align: right; }
td.xfer   { color: #4caf50; text-align: right; }
td.total      { font-weight: bold; color: #a0d4f5; text-align: right; }
td.total.neg  { color: #f44336; }
thead th.c    { text-align: center; }
td.xferd  { color: #4caf50; }
</style>
</head>
<body>

<h1>Transactions</h1>

<!-- Controls -->
<div class="panel">
  <div class="panel-title">Filter</div>
  <div id="controls">
    <label>From: <input type="date" id="from-date"></label>
    <button id="refresh-btn" onclick="loadData()">Refresh</button>
    <span id="status" class="loading">Loading…</span>
  </div>
</div>

<!-- Chart -->
<div class="panel">
  <div class="panel-title">Balance Over Time</div>
  <div id="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-title">Transaction List</div>
  <div class="table-wrap">
    <table>
      <thead><tr id="t-head"></tr></thead>
      <tbody id="t-body"></tbody>
    </table>
  </div>
</div>

<script>
const PALETTE = [
  '#e6194b', '#4363d8', '#f58231', '#3cb44b', '#911eb4',
  '#42d4f4', '#f032e6', '#469990', '#9a6324', '#aaffc3',
];

let chartInstance = null;

function fmt(v) {
  return v.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

async function loadData() {
  const from = document.getElementById('from-date').value;
  const btn  = document.getElementById('refresh-btn');
  btn.disabled = true;
  setStatus('Loading…', 'loading');

  try {
    const url  = '/api/transactions' + (from ? `?from=${encodeURIComponent(from)}` : '');
    const resp = await fetch(url);
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${text.slice(0, 200)}`);
    }
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    const accounts = activeAccounts(data.accounts, data.rows);
    renderChart(accounts, data.rows);
    renderTable(accounts, data.rows);
    const count = data.rows.length.toLocaleString();
    setStatus(`${count} row${data.rows.length !== 1 ? 's' : ''} loaded`, 'ok');
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function activeAccounts(accounts, rows) {
  const used = new Set();
  for (const row of rows) {
    for (const [id, v] of Object.entries(row.amounts)) {
      if (v !== 0 && v !== null && v !== undefined) used.add(id);
    }
  }
  return accounts.filter(a => used.has(a.id));
}

function renderChart(accounts, rows) {
  const dateBalances = {};
  const dateTotals   = {};
  for (const row of rows) {
    if (row.date) {
      dateBalances[row.date] = row.chart_balances;
      dateTotals[row.date]   = row.total;
    }
  }

  const labels   = Object.keys(dateBalances).sort();
  const datasets = accounts.map((acc, i) => ({
    label:           acc.name,
    data:            labels.map(d => dateBalances[d][acc.id] ?? 0),
    borderColor:     PALETTE[i % PALETTE.length],
    backgroundColor: 'transparent',
    borderWidth:     1.5,
    pointRadius:     0,
    tension:         0.1,
  }));

  datasets.push({
    label:           'Total',
    data:            labels.map(d => dateTotals[d] ?? 0),
    borderColor:     '#ffffff',
    backgroundColor: 'transparent',
    borderWidth:     3,
    borderDash:      [10, 4],
    pointRadius:     0,
    tension:         0.1,
    order:           0,
  });

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      animation:           false,
      interaction:         { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels:   { color: '#aac', font: { size: 11 }, boxWidth: 20 },
        },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`,
          },
        },
      },
      scales: {
        x: {
          ticks: { maxTicksLimit: 20, maxRotation: 45, color: '#668' },
          grid:  { color: '#222240' },
        },
        y: {
          ticks: {
            color:    '#668',
            callback: v => v.toLocaleString('en-GB', { minimumFractionDigits: 2 }),
          },
          grid: { color: '#222240' },
        },
      },
    },
  });
}

function renderTable(accounts, rows) {
  const thead = document.getElementById('t-head');
  const tbody = document.getElementById('t-body');

  thead.innerHTML =
    '<th>Date</th><th>Description</th>' +
    accounts.map(a => `<th class="c">${a.name}</th>`).join('') +
    '<th class="c">Total</th>';

  const parts = [];
  for (const row of rows) {
    parts.push(`<tr${row.is_ob ? ' class="ob"' : ''}>`);
    parts.push(`<td>${row.date}</td>`);
    parts.push(`<td${row.transfer && !row.is_ob ? ' class="xferd"' : ''}>${row.description}</td>`);

    for (const acc of accounts) {
      const v = row.amounts[acc.id];
      if (v === undefined || v === null || v === 0) {
        parts.push('<td></td>');
      } else {
        const cls = row.transfer ? 'xfer' : (v < 0 ? 'neg' : 'pos');
        parts.push(`<td class="${cls}">${fmt(v)}</td>`);
      }
    }

    parts.push(`<td class="total${row.total < 0 ? ' neg' : ''}">${fmt(row.total)}</td>`);
    parts.push('</tr>');
  }
  tbody.innerHTML = parts.join('');
}

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
