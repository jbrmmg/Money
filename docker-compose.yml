services:
  money:
    image: nexus.jbrmmg.me.uk:8084/money:latest
    container_name: money
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SPRING_H2_CONSOLE_ENABLED=false
      - MONEY_REGULAR_ENABLED=true
      - MONEY_REPORT_ENABLED=true
      - MONEY_ARCHIVE_ENABLED=true
    volumes:
      - money-logs:/app/logs
      - money-working:/app/reports/working
      - /media/Shared/Documents/html/money-reports:/app/reports/share
      - /home/jason/Downloads:/app/reconcile
    networks:
      - jbr-network

volumes:
  money-logs:
  money-working:

networks:
  jbr-network:
    external: true