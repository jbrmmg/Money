databaseChangeLog:
  - changeSet:
      id: report-test-data
      author: jason
      changes:
        - loadData:
            tableName: transaction
            columns:
              - column:
                  name: account
              - column:
                  name: category
              - column:
                  name: date
              - column:
                  name: amount
              - column:
                  name: description
              - column:
                  name: oppositeid
              - column:
                  name: statement_month
              - column:
                  name: statement_year
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/report/data/transaction.csv
            separator: ","
        - loadData:
            tableName: reconciliation_data
            columns:
              - column:
                  name: category
              - column:
                  name: date
              - column:
                  name: amount
              - column:
                  name: description
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/report/data/reconciliation.csv
            separator: ","
        - loadData:
            tableName: regular
            columns:
              - column:
                  name: id
              - column:
                  name: account
              - column:
                  name: amount
              - column:
                  name: category
              - column:
                  name: frequency
              - column:
                  name: start
              - column:
                  name: last_created
              - column:
                  name: weekend_adj
              - column:
                  name: description
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/report/data/regular.csv
            separator: ","
        - loadData:
            tableName: statement
            columns:
              - column:
                  name: account
              - column:
                  name: month
              - column:
                  name: year
              - column:
                  name: open_balance
              - column:
                  name: locked
              - column:
                  name: deleted
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/report/data/statement.csv
            separator: ","
