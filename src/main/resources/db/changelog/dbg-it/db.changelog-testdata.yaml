databaseChangeLog:
  - changeSet:
      id: report-test-data
      author: jason
      changes:
        - delete:
            tableName: statement
        - loadData:
            tableName: statement
            columns:
              - column:
                  name: account
              - column:
                  name: month
              - column:
                  name: year
              - column:
                  name: open_balance
              - column:
                  name: locked
              - column:
                  name: deleted
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/test-data/report/statement.csv
            separator: ","
        - loadData:
            tableName: transaction
            columns:
              - column:
                  name: account
              - column:
                  name: category
              - column:
                  name: date
              - column:
                  name: amount
              - column:
                  name: description
              - column:
                  name: oppositeid
              - column:
                  name: statement_month
              - column:
                  name: statement_year
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/test-data/report/transaction.csv
            separator: ","
        - loadData:
            tableName: reconciliation_data
            columns:
              - column:
                  name: category
              - column:
                  name: date
              - column:
                  name: amount
              - column:
                  name: description
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/test-data/report/reconciliation.csv
            separator: ","
        - loadData:
            tableName: regular
            columns:
              - column:
                  name: id
              - column:
                  name: account
              - column:
                  name: amount
              - column:
                  name: category
              - column:
                  name: frequency
              - column:
                  name: start
              - column:
                  name: last_created
              - column:
                  name: weekend_adj
              - column:
                  name: description
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/test-data/report/regular.csv
            separator: ","
        - loadData:
            tableName: reconciliation_file
            columns:
              - column:
                  name: name
              - column:
                  name: account_id
              - column:
                  name: last_modified
              - column:
                  name: size
              - column:
                  name: error
              - column:
                  name: loaded
            commentLineStartsWith: //
            encoding: UTF-8
            file: /db/changelog/test-data/report/reconciliation_file.csv
            separator: ","
