spring:
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:h2:mem:test;INIT=CREATE SCHEMA IF NOT EXISTS TEST;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password:
        hikari:
            poolName: Hikari
            auto-commit: false

        internal:
            type: com.zaxxer.hikari.HikariDataSource
            url: jdbc:h2:mem:internal;INIT=CREATE SCHEMA IF NOT EXISTS TEST;DB_CLOSE_ON_EXIT=FALSE
            username: sa
            password:
            hikari:
                poolName: Hikari2
                auto-commit: false

        h2:
            console:
                enabled: false

    liquibase:
        change-log: classpath:/db/changelog/dbg/db.changelog-master.yaml
        contexts: default

    jpa:
        properties:
            hibernate:
                format_sql: true
                show-sql: true

internal:
    liquibase:
        default-schema:
        change-log: classpath:/db/changelog/internal/db.changelog-master.yaml
        contexts: default

money:
    service-name: Middle Tier Test
    regular-schedule: 0 30 2 * * ?
    regular-enabled: true
    report-schedule: 0 0 4 20-31 * ?
    report-enabled: false
    archive-schedule: 0 0 4 20-31 1 ?
    archive-enabled: false
    report-share: ./target/testfiles/MoneyReports/
    report-working: ./target/testfiles/PdnReport/
    reconcile-file-location: src/test/resources/reconciliation
    smtp-port: 1025
    smtp-host: ignore.do.not.send
    smtp-from: a@test.com
    smtp-to: test@test.com
    today: 2023-05-24

logging:
    level:
        ROOT: INFO
        com.jbr.middletier: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql: TRACE
        org.hibernate.orm.jdbc.bind: TRACE

